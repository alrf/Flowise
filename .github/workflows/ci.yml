name: Build & Optional Push

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      push:
        description: "Push to GHCR"
        type: boolean
        required: true
        default: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate tag
        id: tag
        run: |
          DATE=$(date +'%Y%m%d-%H%M')
          SHA=$(git rev-parse --short HEAD)
          echo "TAG=v3.0.0-${DATE}-${SHA}" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        if: github.event_name == 'workflow_dispatch' && inputs.push == true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build APP & Push (manual only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'workflow_dispatch' && inputs.push == true }}
          tags: ${{ env.IMAGE_NAME }}/flowise:${{ steps.tag.outputs.TAG }}
